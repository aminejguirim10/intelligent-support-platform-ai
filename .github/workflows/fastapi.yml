name: FastAPI CI + Docker

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  push_to_docker_hub:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-ia:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-ia:${{ github.sha }}

      - name: Tag latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-ia:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-ia:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-ia:latest
